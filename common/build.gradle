plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    def interfaces = file('src/main/resources/interfaces.json')
    if (interfaces.exists()) {
        interfaceInjectionData.from(interfaces.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnlyApi "org.jetbrains:annotations:24.1.0"
    compileOnlyApi "org.apache.commons:commons-lang3:3.14.0"

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly 'org.ow2.asm:asm-tree:9.6'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    compileOnly("org.dimdev:limlib-common-${minecraft_version}:${limlib_version}")
    accessTransformers("org.dimdev:limlib-common-${minecraft_version}:${limlib_version}")
    api("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    compileOnly "maven.modrinth:sodium:${sodium_neoforge_version}"
    compileOnly "maven.modrinth:iris:${iris_neoforge_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonKotlin {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonKotlin file('src/main/kotlin')
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
